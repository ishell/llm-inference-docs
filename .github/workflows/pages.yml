# 推到 main 后发布 GitHub Pages。
# 站点：https://ishell.github.io/llm-inference-docs/
#
# 第一次若 403 / 站点没出来：仓库 Settings → Pages → Source 选 GitHub Actions。
# 公开仓库上，成功跑完 deploy-pages 后 GitHub 会自动打开 Pages。

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pack static site
        run: |
          mkdir -p _site
          rsync -a \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            --exclude 'scripts/' \
            ./ _site/
          test -f _site/index.html
          test -f _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show site URL
        run: |
          echo "### Site" >> "$GITHUB_STEP_SUMMARY"
          echo "https://ishell.github.io/llm-inference-docs/" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
