# 推到 main 后发布 GitHub Pages。
# 站点：https://ishell.github.io/llm-inference-docs/
#
# GITHUB_TOKEN 不能新建 Pages 站点。第一次二选一：
#   1. Settings → Pages → Source = GitHub Actions
#   2. 仓库 Secrets 加 PAGES_TOKEN（有 repo 管理权限的 PAT），本 workflow 会自己打开 Pages

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Pack static site
        run: |
          mkdir -p _site
          rsync -a \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            --exclude 'scripts/' \
            ./ _site/
          test -f _site/index.html
          test -f _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Ensure GitHub Pages exists
        env:
          GH_TOKEN: ${{ secrets.PAGES_TOKEN || github.token }}
        run: |
          set +e
          gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/pages" \
              -f build_type=workflow >/dev/null
            echo "Pages already on; build_type=workflow"
            exit 0
          fi
          if gh api --method POST "repos/${GITHUB_REPOSITORY}/pages" \
            -f build_type=workflow >/dev/null; then
            echo "Created Pages site (workflow)"
            exit 0
          fi
          echo "::error::GitHub Pages is not enabled. Open Settings → Pages → Source → GitHub Actions (once). Or add a PAGES_TOKEN secret (PAT with repo admin) so this job can create the site. GITHUB_TOKEN cannot enable Pages."
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Show site URL
        run: |
          {
            echo "### Site"
            echo "https://ishell.github.io/llm-inference-docs/"
            echo "${{ steps.deployment.outputs.page_url }}"
          } >> "$GITHUB_STEP_SUMMARY"
